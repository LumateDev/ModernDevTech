services:
  master:
    build:
      context: .
      dockerfile: Lab3.Replication.Node/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      NodeId: "master-A"
      IsMaster: "true"
      ReplicaUrls: "http://replica-b:8080,http://replica-c:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/api/admin/status || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 3

  replica-b:
    build:
      context: .
      dockerfile: Lab3.Replication.Node/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      NodeId: "replica-B"
      IsMaster: "false"
      ReplicaUrls: ""
    depends_on:
      - master

  replica-c:
    build:
      context: .
      dockerfile: Lab3.Replication.Node/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      NodeId: "replica-C"
      IsMaster: "false"
      ReplicaUrls: ""
    depends_on:
      - master

  tests:
    build:
      context: .
      dockerfile: Lab3.Replication.Tests/Dockerfile
    depends_on:
      - master
      - replica-b
      - replica-c
    environment:
      MASTER_URL: "http://master:8080"
      REPLICA_B_URL: "http://replica-b:8080"
      REPLICA_C_URL: "http://replica-c:8080"
