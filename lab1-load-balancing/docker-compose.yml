services:
  service-1:
    build:
      context: ./lab1-load-balancing
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=service-1
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8081:8080"

  service-2:
    build:
      context: ./lab1-load-balancing
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=service-2
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8082:8080"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - service-1
      - service-2
